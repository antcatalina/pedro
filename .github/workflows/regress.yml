name: regress

# Machine-independent CI for pedroc. This is the AUTHORITATIVE green/red signal:
# it runs the exact same command AntMac's cron runs (`python tools/regress.py`)
# but on GitHub's infrastructure, so the repo stays verifiable even if the Mac is
# down, logged out, or misconfigured. Do not add continue-on-error or allowed
# failures: a non-zero regress.py MUST fail the check.

on:
  push:
    branches: [agent/dev, master]
  pull_request:

# Least privilege: this job only reads the repo to run the suite; it never
# writes back, comments, or touches other resources.
permissions:
  contents: read

# Don't let a superseded push keep an old run burning minutes: a newer commit
# on the same ref cancels the in-flight run.
concurrency:
  group: regress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regress:
    runs-on: ubuntu-latest
    # A green run is well under a minute; a hung/non-terminating regress.py must
    # not sit on a runner. This caps the blast radius without masking failures.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Node puts `node` on PATH so the TS lane's `ts_available()` probe
      # (tools/backends.py) lights up automatically; no build step is needed
      # because node v24+ strips TypeScript types at runtime.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # pedroc is zero-dependency (stdlib only). Installing it editable puts the
      # `pedroc` console script on PATH so the packaging tests exercise the real
      # entry point; regress.py itself needs no PYTHONPATH (it bootstraps sys.path).
      - name: Install pedroc (editable)
        run: python -m pip install -e .

      # This is the same command AntMac's cron and README document as CI.
      - name: Run regression suite
        run: python tools/regress.py
